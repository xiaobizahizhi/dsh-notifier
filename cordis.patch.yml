# dsh-notifier bundle patch: inserts the plugin row into the profile roster.
# Install with `dsh plugin --profile <name> add file:/path/to/dsh-notifier`;
# the patch layer is applied through the loader on boot.
#
# 空配置随插件附带：channels 为空时插件只订阅不动作（绝不弄崩启动），
# 在 profile 的 cordis.patch.yml 里覆盖本行 config.channels 即可配置渠道。
- insert:
    - id: dsh-notifier
      name: 'dsh-notifier'
      config:
        enabled: true
        debounceMs: 10000
        summaryMaxChars: 500
        channels: []
        # 方案 0（个人 fork 隐形模式）：关闭本机管理台。本分支不注册任何前端入口
        # （main / sidebar.panellist / activation），通知与 QQ 回传全在后台工作；
        # 渠道配置走 profile 的 cordis.patch.yml 覆盖本行 config.channels，
        # QQ 官方扫码用 scripts/channel-login.mjs qq（需要可选依赖 qqbot-connector）。
        admin:
          enabled: false
